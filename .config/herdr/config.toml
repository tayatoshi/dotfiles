onboarding = false

[terminal]
# tmux の split-window -c "#{pane_current_path}" 相当
new_cwd = "follow"

[keys]
# tmux と同じ prefix
prefix = "ctrl+t"

# 設定の再読み込み(tmux の prefix+r 相当)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# ペイン分割(tmux: | と -)
split_vertical = ["prefix+|", "prefix+backslash"]
split_horizontal = "prefix+minus"

# ペイン移動(tmux: hjkl)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ペインのリサイズ(tmux の M-矢印 の代わり。alt 単体は macOS で化けるため ctrl+shift+alt)
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

[ui]
# エージェントの状態を色付きの点ではなく、形の違う記号で表示する
status_indicators = "symbols"
# Ctrl+t b で折りたたんだとき、細いバーも残さず完全に非表示にする
sidebar_collapsed_mode = "hidden"

[ui.sidebar.agents]
row_gap = 1
# 1 行目: 状態（記号+色付きテキスト）+ ワークスペース、2 行目: エージェント名 + タイトル。
# インラインテーブルは途中で改行できないため rules を持つ行は長くなる。
rows = [
  ["state_icon", { token = "state_text", rules = [{ contains = "block", ignore_case = true, fg = "#ff757f", bold = true, dim = false }, { contains = "work", ignore_case = true, fg = "#ffc777", dim = false }, { contains = "done", ignore_case = true, fg = "#4fd6be", dim = false }, { contains = "idle", ignore_case = true, fg = "#828bb8", dim = false }, { contains = "unknown", ignore_case = true, fg = "#636da6", dim = false }] }, { token = "workspace", fg = "#c8d3f5", dim = false }],
  [
    # agent トークンの値は claude / codex / agy / opencode
    { token = "agent", rules = [{ contains = "claude", ignore_case = true, fg = "#CC7C5E", dim = false }, { contains = "codex", ignore_case = true, fg = "#49A3B0", dim = false }, { contains = "agy", ignore_case = true, fg = "#60BA7E", dim = false }, { contains = "opencode", ignore_case = true, fg = "#3B82F6", dim = false }] },
    { token = "terminal_title_stripped", fg = "#828bb8", dim = false },
  ],
]
